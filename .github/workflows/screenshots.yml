name: Screenshots

on:
  push:
  workflow_dispatch:

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    name: Capture demo screenshots on an iPhone and an iPad
    runs-on: xcode-27
    env:
      LC_ALL: en_US.UTF-8
      LANG: en_US.UTF-8

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # Named before anything can fail, so a partial run still uploads under the right name.
      - name: Name the screenshot run
        run: echo "SCREENSHOTS_RUN=$(git rev-parse --short HEAD)_$(date -u +%Y-%m-%d_%H-%M-%S)" >> "$GITHUB_ENV"
      - name: Select latest Xcode
        run: |
          chmod +x ./.github/scripts/select_xcode.sh
          ./.github/scripts/select_xcode.sh
      - name: Install Metal toolchain
        run: |
          chmod +x ./.github/scripts/install_metal_toolchain.sh
          ./.github/scripts/install_metal_toolchain.sh
      - name: Configure Xcode
        run: |
          chmod +x ./.github/scripts/configure_xcode.sh
          ./.github/scripts/configure_xcode.sh
      # The demos read the TMDB key from PreviewSecrets.swift; Build.xcconfig is only for the Rebuild app.
      - name: Set up the TMDB preview key
        run: |
          sed 's/REPLACE_ME/'"${{ secrets.API_KEY }}"'/' \
            Sources/TMDB_Shared_Backend/Preview/PreviewSecrets.swift.template \
            > Sources/TMDB_Shared_Backend/Preview/PreviewSecrets.swift
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Capture screenshots
        run: bundle exec fastlane screenshots
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SCREENSHOTS_RUN }}
          # Uploading the folder above the run keeps the run on top: <run>/<demo>/<screenshot>/<device>.png.
          # A fresh checkout holds only this run there.
          path: fastlane/screenshots/
          if-no-files-found: error
          compression-level: 9
          retention-days: 14
