name: iOS Tests and Coverage

on:
  push:
    branches: [ "main", "dev", "cicd" ]
  pull_request:
    branches: [ "main", "dev", "cicd" ]
  workflow_dispatch:

jobs:
  test:
    name: Run unit tests
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Select latest Xcode
        run: |
          chmod +x ./.github/scripts/select_xcode.sh
          ./.github/scripts/select_xcode.sh
      - name: Check environment
        run: |
          swift --version
          xcodebuild -version
          xcrun xctrace list devices 2>&1
      - name: Configure Xcode
        run: |
          chmod +x ./.github/scripts/configure_xcode.sh
          ./.github/scripts/configure_xcode.sh
      - name: Set up secrets in xcconfig
        run: |
          echo "TMDB_API_KEY=${{ secrets.API_KEY }}" >> Rebuild/Rebuild/Build.xcconfig
          echo "PRODUCT_BUNDLE_IDENTIFIER=com.openmangosteen.everythingclient" >> Rebuild/Rebuild/Build.xcconfig
      - name: Set Default Scheme
        run: |
          chmod +x ./.github/scripts/set_scheme.sh
          ./.github/scripts/set_scheme.sh
      - name: Find Simulator
        env:
          scheme: ${{ 'default' }}
          platform: ${{ 'iOS Simulator' }}
        run: |
          chmod +x ./.github/scripts/find_simulator.sh
          ./.github/scripts/find_simulator.sh
      - name: Run tests
        env:
          scheme: ${{ 'default' }}
          platform: ${{ 'iOS Simulator' }}
        run: |
          chmod +x ./.github/scripts/test-only.sh
          ./.github/scripts/test-only.sh
      - name: Verify coverage data before upload
        run: |
          ls -la .DerivedData/everythingclient/Build
          ls -la .DerivedData/everythingclient/Build/ProfileData
          find .DerivedData/everythingclient/Build/ProfileData -name Coverage.profdata
          ls -la .DerivedData/everythingclient/Build/Products/Debug-iphonesimulator/*Tests.xctest
      - name: Upload coverage data
        uses: actions/upload-artifact@v4
        with:
          name: coverage-data
          path: .DerivedData/everythingclient/Build
          retention-days: 1

  coverage:
    name: Check code coverage
    runs-on: macos-26
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Select latest Xcode
        run: |
          chmod +x ./.github/scripts/select_xcode.sh
          ./.github/scripts/select_xcode.sh
      - name: Download coverage data
        uses: actions/download-artifact@v4
        with:
          name: coverage-data
          path: .DerivedData/everythingclient/Build
      - name: Verify coverage data after download
        run: |
          ls -la .DerivedData/everythingclient/Build
          ls -la .DerivedData/everythingclient/Build/ProfileData
          find .DerivedData/everythingclient/Build/ProfileData -name Coverage.profdata
          ls -la .DerivedData/everythingclient/Build/Products/Debug-iphonesimulator/*Tests.xctest
      - name: Check coverage
        run: |
          chmod +x ./.github/scripts/coverage-check.sh
          ./.github/scripts/coverage-check.sh
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: .output/coverage_report.txt
          retention-days: 14
